name: Build the workspaces
description: >
  The four builds a test job needs before it runs anything: the SDK first, because actions, mcp and
  dev-tools read its dist/ by relative path, then the three that read it.

runs:
  using: composite
  steps:
    - name: SDK — build
      shell: bash
      run: pnpm --filter './sdk' build

    - name: Actions — build
      shell: bash
      run: pnpm --filter './actions' build

    # The MCP server reads the SDK's dist/ (the sauce command's own modules), so it comes after
    # the SDK build, as actions does.
    - name: MCP — build
      shell: bash
      run: pnpm --filter './mcp' build

    # dev-tools reads the SDK's dist/ too. The testing kit (`@eco-incorp/sauce/testing`) ships from
    # dev-tools/dist, which the packed check installs.
    - name: Dev Tools — build
      shell: bash
      run: pnpm --filter './dev-tools' build
