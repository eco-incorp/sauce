name: Publish

# Publishes the single @eco-incorp/sauce package, bundling sdk / actions under
# one root package.json with subpath exports, the agent skills, and the `sauce`
# bin.
#
# THE VERSION IS COMPUTED, NOT TYPED. Dispatch this workflow on `main`: `plan` reads the
# Conventional Commit history since the newest `vX.Y.Z` tag and derives the next version, and
# `.github/scripts/release-version.mjs` states the rules (feat -> minor, fix/perf/revert -> patch,
# `!` or a BREAKING CHANGE footer -> major, anything else releases nothing). A MAJOR is the SDK's
# own and is refused unless `allow_major` is ticked: only for a change SDK users would notice, never
# for an engine or compiler major that the SDK absorbs (see CLAUDE.md, "What a major means"). Tick `dry_run` to stop
# after the plan: the number and the release notes are in the run summary, and nothing is built,
# published or tagged. `release_as` replaces the number only, for a history that misstates it.
# There is no tag-push trigger. After `git fetch --tags`, running the script locally gives the same
# number (without the npm check): `v1.0.0` is on no branch, so a plain fetch never receives it.
#
# The plan is held to npm: the baseline tag must be published and be the newest stable version
# there. A tag npm lacks (pushed by hand) or a version npm has that no tag names (published, then
# the tag step failed) STOPS the plan. This is what ties a version to its commit, since npm records
# no `gitHead` for this package: a fresh dispatch after a failed `release` job would otherwise
# compute the same version from a newer commit, skip the publish, and tag that commit.
#
# After the plan: Checks and Lint gate the commit, `publish` builds and publishes to npm, and
# `release` tags `vX.Y.Z` and creates the GitHub release, in that order.
#
# RECOVERY. If `publish` succeeded and `release` failed, use "Re-run failed jobs" on THAT run: it
# keeps the commit, the number and the notes, so the tag lands on the commit that was published.
# Do not dispatch again; the plan refuses. If that run can no longer be re-run, an admin tags the
# commit it built (shown on the run) as `vX.Y.Z` and creates the release by hand; the next
# dispatch then continues from that tag.
#
# Publishes to PUBLIC npmjs.com ONLY (auth: NPM_TOKEN).
#
# GitHub Packages was dropped deliberately: it is not a distribution channel
# anyone consumes here, and its step was the only failing part of the v0.2.0
# release — it appended a token line for npm.pkg.github.com to ~/.npmrc, but
# setup-node had already written a `registry-url` for npmjs, so pnpm resolved
# auth against the CONFIGURED registry and ignored the one passed via
# `--registry`, failing with ENEEDAUTH after npmjs had already published. That
# left the run red on a release that had in fact succeeded, which is worse than
# not publishing there at all.
#
# Required repo secrets:
#   (no PAT) — v12 artifacts come from GHCR via the built-in GITHUB_TOKEN (to download its
#                      private RELEASE assets during the sync)
#   NPM_TOKEN          npmjs.com automation token with publish rights on
#                      the @eco-incorp scope

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute the next version and its release notes, then STOP. Nothing is built, published or tagged."
        type: boolean
        default: false
      allow_major:
        description: "Tick ONLY if SDK users will notice the change (SauceScript, exports, the CLI, MCP tools). A computed or given major is refused without it. An engine or compiler major the SDK absorbs is not one."
        type: boolean
        default: false
      release_as:
        description: "Optional X.Y.Z to publish instead of the computed version, for a number the history misstates (a revert of a breaking change still counts as breaking). Must be above the newest release; it never forces a release no commit drives."
        type: string
        default: ""

# One release at a time, and a run in progress is never cancelled: a publish cannot be taken back.
# A dry run writes nothing, so it takes a group of its own: in the shared one it would wait behind a
# release, and cancel a real run already pending there (a group holds one pending run).
concurrency:
  group: ${{ inputs.dry_run && format('publish-dry-run-{0}', github.run_id) || 'publish' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # No secrets and no write access: it only reads history and the public registry, and reports.
  # A real release from any ref but `main` is refused here. That is a convenience, NOT an access
  # control: a dispatch (or a tag push) runs the publish.yml of the ref it names, and every
  # pre-merge commit still carries the old one, with no such check, and NPM_TOKEN is an
  # organisation secret no environment scopes to a ref. See "Hardening" in CLAUDE.md.
  plan:
    name: Plan the release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.plan.outputs.released }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Refuse a release from any branch but main
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          REF: ${{ github.ref }}
        run: |
          if [ "$DRY_RUN" != "true" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "::error::a release is cut from main, not $REF. Dispatch on main, or tick dry_run."
            exit 1
          fi

      # Full history and every tag: the baseline is the newest vX.Y.Z tag and the commits after it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # What npm has, read without a token (the package is public). The plan is held to it: the
      # baseline tag must be published and be the newest stable version there. A failed read stops
      # the run: `set -e` is on, and an empty answer is refused by the script as well.
      - name: Read the versions npm has
        run: npm view @eco-incorp/sauce versions --json > "$RUNNER_TEMP/published.json"

      - name: Compute the next version from the commit history
        id: plan
        env:
          RELEASE_AS: ${{ inputs.release_as }}
          ALLOW_MAJOR: ${{ inputs.allow_major }}
        run: |
          args=(--published "$RUNNER_TEMP/published.json" --release-as "$RELEASE_AS" --notes "$RUNNER_TEMP/notes.md")
          if [ "$ALLOW_MAJOR" = "true" ]; then args+=(--allow-major); fi
          node .github/scripts/release-version.mjs "${args[@]}"

      - name: Keep the notes for the release job
        if: steps.plan.outputs.released == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md
          if-no-files-found: error

  # THE GATE. A dispatch matches neither ci.yml's nor lint.yml's `push`/`pull_request` filters, so
  # without these the release would publish whatever compiled with no test, lint or typecheck run
  # against the commit. They call the same workflows CI runs rather than repeating their steps.
  # Skipped on a dry run, and when no commit drives a release.
  checks:
    name: Checks
    needs: plan
    if: needs.plan.outputs.released == 'true' && !inputs.dry_run
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ci.yml

  lint:
    name: Lint
    needs: plan
    if: needs.plan.outputs.released == 'true' && !inputs.dry_run
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml

  publish:
    name: Publish @eco-incorp/sauce
    needs: [plan, checks, lint]
    if: needs.plan.outputs.released == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # `anvil` is what the sdk build's engine e2e path needs; nothing here compiles contracts any
      # more, since the ABIs arrive as a pinned release asset.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # BEFORE the build, so a token that cannot publish fails in seconds rather than after the gate
      # and the build. Note what it does NOT prove: the FIRST publish of a name cannot be authorised
      # in advance, so for `@eco-incorp/sauce`'s first release this only shows the token is valid
      # and scoped somewhere.
      - name: Verify the npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          who=$(npm whoami) || { echo "::error::NPM_TOKEN is missing or invalid — refusing to build a release that cannot publish"; exit 1; }
          echo "authenticated to npmjs.com as $who"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # GH_TOKEN: the sdk build's sync step downloads V12RuntimeBytecode from the eco-incorp/v12
      # v12-evm release, and that repo is private. Without it the artifact is skipped with a warning
      # and the verify step below refuses to publish.
      - name: Build all areas (sdk + actions + mcp)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SAUCE_ARTIFACT_SOURCE: github-packages
        run: pnpm build

      # `pnpm build`'s sync writes only the JSON artifacts; the SVM engine binaries land in
      # `sdk/dist/artifacts/svm` only under `--fetch-v12-engines`. Run it explicitly (with the
      # private-repo token) so the gated `.so` ship in the tarball — the ONLY way a consumer gets the
      # engine, since eco-incorp/v12 is private and the fetch path is closed to them.
      - name: Fetch + ship the SVM engine binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SAUCE_ARTIFACT_SOURCE: github-packages
        run: pnpm --filter './sdk' sync-engine-artifacts --fetch-v12-engines

      # The sdk build's sync is tolerant by design (a local dev tree without the release assets still
      # builds), so a broken generation would NOT fail the build — it would ship an empty
      # dist/artifacts, exactly how 0.7.0 broke. Hard-gate publish on the artifacts + templates
      # actually being present in the tarball dir.
      - name: Verify the tarball will ship the engine artifacts + templates
        run: |
          for a in IERC20 ISauceRouter IUniswapV3Pool Router V12Kitchen V12Pot V12RuntimeBytecode V12EngineGate; do
            test -s "sdk/dist/artifacts/$a.json" || { echo "::error::build did not produce sdk/dist/artifacts/$a.json — refusing to publish (would ship broken)"; exit 1; }
          done
          # The SVM engine binaries — the only way a consumer gets the engine (eco-incorp/v12 is
          # private). Missing here means the published SDK cannot run SVM programs locally at all.
          for so in engine-devnet engine-mainnet kitchen; do
            test -s "sdk/dist/artifacts/svm/$so.so" || { echo "::error::build did not produce sdk/dist/artifacts/svm/$so.so — refusing to publish (SVM engine would be missing from the package)"; exit 1; }
          done
          # The deployed addresses, assembled from each release's addresses.json — what ./deployments
          # reads for the current Kitchen / engine / Router. Its own sync step is tolerant, so gate here.
          test -s sdk/dist/artifacts/V12Deployments.json || { echo "::error::build did not produce sdk/dist/artifacts/V12Deployments.json — refusing to publish (deployed addresses would be missing)"; exit 1; }
          test -s sdk/dist/recipes/settle.sauce.ts || { echo "::error::missing sdk/dist/recipes/settle.sauce.ts"; exit 1; }
          test -s sdk/dist/svm/recipes/settle.sauce.ts || { echo "::error::missing sdk/dist/svm/recipes/settle.sauce.ts"; exit 1; }
          # exports["./compiler"] points here. It exists only if the sdk build ran, and a missing file
          # would ship a package whose /compiler subpath cannot resolve -- the 0.7.0 failure shape.
          test -s sdk/dist/compiler.js || { echo "::error::missing sdk/dist/compiler.js — the ./compiler subpath would not resolve"; exit 1; }
          # The bin, and the MCP server `sauce mcp` loads from mcp/dist: a missing one ships a package
          # whose command, or whose `sauce mcp`, cannot run.
          test -s sdk/dist/cli/main.js || { echo "::error::missing sdk/dist/cli/main.js — the sauce bin would not run"; exit 1; }
          test -s mcp/dist/entry.js || { echo "::error::missing mcp/dist/entry.js — sauce mcp would not run"; exit 1; }
          echo "verified: 8 engine artifacts + deployed addresses + 3 SVM binaries + both settle templates + the ./compiler entry point + the bin and the MCP server"

      # The version is the plan job's: computed from the commit history, or the manual `release_as`.
      - name: Set root package version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      # The plan REFUSES a version that npm already has, so by the time this runs the version is not
      # on npm, and publishing it is what ties it to $GITHUB_SHA. It can exist here only if something
      # published it since the plan, or an earlier attempt of THIS run did. "Re-run failed jobs"
      # keeps the run's commit, so that earlier attempt's tarball is this commit's and the publish
      # is skipped; on the first attempt nothing in this run published it, so its source cannot be
      # proven and this refuses. npm records no `gitHead` for this package, so existence is all
      # there is to ask, which is why the tie to the commit is made here and in the plan.
      - name: Publish to npmjs.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if npm view "@eco-incorp/sauce@$VERSION" version >/dev/null 2>&1; then
            if [ "$ATTEMPT" = "1" ]; then
              echo "::error::@eco-incorp/sauce@$VERSION appeared on npmjs.com after the plan, and nothing in this run published it: its source cannot be shown to be $GITHUB_SHA. Refusing."
              exit 1
            fi
            echo "@eco-incorp/sauce@$VERSION was published by an earlier attempt of this run, from $GITHUB_SHA: skipping the publish."
          else
            pnpm publish --access public --no-git-checks
          fi

  # Tag and GitHub release, AFTER the publish and in their own job so the one with `contents:
  # write` never holds NPM_TOKEN, and the one with NPM_TOKEN cannot write to the repository. The
  # tag is created by `gh release create` on the commit the run built, so no branch is pushed to,
  # which the default-branch ruleset (pull request required) would refuse.
  #
  # Nothing is recomputed here. The number and the notes are the plan's, from this run: once the tag
  # exists the baseline has moved and a recompute would find nothing to release, so a re-run after a
  # `gh release create` that succeeded but reported an error would fail on a finished release. The
  # tag is checked instead: absent, it is created at $GITHUB_SHA; already at $GITHUB_SHA, there is
  # nothing to do; anywhere else, this run refuses and moves nothing.
  release:
    name: Tag and release
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release-notes

      - name: Create the tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          # Where the tag points, if it exists: its commit, with an annotated tag peeled.
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" \
            --jq "map(select(.ref == \"refs/tags/$tag\"))[0].object | select(. != null) | \"\(.type) \(.sha)\"")
          at=""
          if [ -n "$ref" ]; then
            read -r type sha <<<"$ref"
            if [ "$type" = "tag" ]; then
              sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .object.sha)
            fi
            at="$sha"
          fi
          if [ -n "$at" ] && [ "$at" != "$GITHUB_SHA" ]; then
            echo "::error::$tag already exists at $at, but this run published $GITHUB_SHA. Refusing to reuse or move it."
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released at $GITHUB_SHA: nothing to do."
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" \
              --notes-file release-notes/notes.md --latest
          fi
