name: Publish

# Publishes the single @eco-incorp/sauce-sdk package, bundling compiler / sdk /
# actions / dev-tools under one root package.json with subpath exports.
#
# Trigger:
#   git tag v1.2.3 && git push origin v1.2.3
#   — or manual workflow_dispatch with `version` input.
#
# Publishes to PUBLIC npmjs.com ONLY (auth: NPM_TOKEN).
#
# GitHub Packages was dropped deliberately: it is not a distribution channel
# anyone consumes here, and its step was the only failing part of the v0.2.0
# release — it appended a token line for npm.pkg.github.com to ~/.npmrc, but
# setup-node had already written a `registry-url` for npmjs, so pnpm resolved
# auth against the CONFIGURED registry and ignored the one passed via
# `--registry`, failing with ENEEDAUTH after npmjs had already published. That
# left the run red on a release that had in fact succeeded, which is worse than
# not publishing there at all.
#
# Required repo secrets:
#   ECO_INCORP_TOKEN   PAT with read on eco-incorp/sauce (for pnpm install
#                      of the private git dep `sauce`)
#   NPM_TOKEN          npmjs.com automation token with publish rights on
#                      the @eco-incorp scope

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (without leading "v")
        type: string
        required: true
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish @eco-incorp/sauce-sdk
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure git auth for private deps
        env:
          ECO_INCORP_TOKEN: ${{ secrets.ECO_INCORP_TOKEN }}
        run: |
          if [ -z "${ECO_INCORP_TOKEN:-}" ]; then
            echo "::error::Missing repo secret ECO_INCORP_TOKEN — required to clone the private eco-incorp/sauce git dep. Add a PAT with read access on eco-incorp/sauce under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          # Kept identical to ci.yml's block. This workflow previously rewrote ONLY the
          # https:// form, which is not the form the lockfile pins: pnpm-lock.yaml records
          # `git+https://git@github.com:eco-incorp/sauce.git#<sha>` (the SSH spelling) when
          # regenerated on a machine that has an `insteadOf` for git@github.com:, so the
          # fetch fell through to SSH on a runner with no SSH key and `pnpm install` failed
          # before anything could be published — every publish attempt died at step 7.
          # Any rewrite added here must be added to ci.yml too, and vice versa.
          #
          # Use --add: insteadOf is multi-valued, so plain `git config` would
          # overwrite each prior value and only the last rule would survive.
          git config --global --add url."https://x-access-token:${ECO_INCORP_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://x-access-token:${ECO_INCORP_TOKEN}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://x-access-token:${ECO_INCORP_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"

      # Foundry builds the sauce engine (compiler postinstall `forge build`) so the
      # `prepack` step can copy engine artifacts into dev-tools/artifacts/ for the tarball.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      # hnc (huff-neo) — the sdk build compiles engine-v12/v12/Runtime.huff with it to GENERATE
      # dist/artifacts/V12RuntimeBytecode.json (nothing committed). Pinned for reproducible bytes.
      - name: Install huff-neo compiler (hnc)
        run: |
          export HUFF_NEO_DIR="$HOME/.huff-neo"   # pin the install dir (runner sets XDG_CONFIG_HOME, which the installer would otherwise use)
          curl -L https://raw.githubusercontent.com/cakevm/huff-neo/main/hnc-up/install | bash
          "$HUFF_NEO_DIR/bin/hnc-up" --install 1.5.13
          echo "$HUFF_NEO_DIR/bin" >> "$GITHUB_PATH"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all areas (compiler first, then sdk/actions in parallel)
        run: pnpm build

      # The sdk build runs sync with SYNC_OPTIONAL_FORGE=1 (tolerant, for local dev), so a broken
      # generation would NOT fail the build — it would ship an empty dist/artifacts (exactly how 0.7.0
      # broke). Hard-gate publish on the artifacts + templates actually being present in the tarball dir.
      - name: Verify the tarball will ship the engine artifacts + templates
        run: |
          for a in IERC20 ISauceRouter IStateView IUniswapV3Pool Router SauceRouter V12Kitchen V12Pot V12RuntimeBytecode; do
            test -s "sdk/dist/artifacts/$a.json" || { echo "::error::build did not produce sdk/dist/artifacts/$a.json — refusing to publish (would ship broken)"; exit 1; }
          done
          test -s sdk/dist/recipes/settle.sauce.ts || { echo "::error::missing sdk/dist/recipes/settle.sauce.ts"; exit 1; }
          test -s sdk/dist/svm/recipes/settle.sauce.ts || { echo "::error::missing sdk/dist/svm/recipes/settle.sauce.ts"; exit 1; }
          echo "verified: 9 engine artifacts + both settle templates present"

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION" ]; then
            echo "Could not resolve version"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"

      - name: Set root package version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish to npmjs.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --access public --no-git-checks
