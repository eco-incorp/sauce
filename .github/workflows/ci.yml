name: CI

# TWO CALLERS OF ONE SET OF JOBS. Every job lives in ci-jobs.yml; this file decides, per run, with
# what token they run and where they take the v12 engine artifacts from:
#
#   internal  a push (main, a `v*` tag), a call from publish.yml, or a pull request from a branch of
#             THIS repository: `packages: read`, and the artifacts from the private v12 release
#             packages this repository is granted read on.
#   fork      a pull request from a fork: `contents: read` and nothing else, and the same artifacts,
#             held to the same digests, from the public @eco-incorp/sauce tarball.
#
# Why. A fork's pull request runs the fork's own code (its tests, its build scripts) with a
# GITHUB_TOKEN of this repository. GitHub caps that token at read, but read on everything the
# workflow names: with `packages: read` it could read the private v12 packages. So the fork caller
# names no `packages` permission, a called workflow cannot widen what its caller grants, and
# ci-jobs.yml names none of its own. Exactly one caller runs: the two `if`s are complements.
#
# `Build & Test` aggregates the two under the check's name from before the split, the name the
# branch ruleset requires and publish.yml's gate reads. A caller's own checks report under its name
# (`internal / Checks`, `fork / SDK engine e2e`, …).

on:
  pull_request:
  push:
    # Tags too: a tag is what publishes, and `branches` does NOT match a tag push, so before this
    # the released commit was the one commit nothing ever checked.
    branches: [main]
    tags: ["v*"]
  # Callable, so publish.yml can gate on these exact steps instead of copying them. A copy would
  # drift, and a gate that has drifted is the thing being fixed here.
  workflow_call:

# Nothing workflow-wide: each caller grants its own, and the aggregate needs no token.
permissions: {}

jobs:
  internal:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # `packages: read` is what lets the built-in GITHUB_TOKEN pull the v12 engine artifacts from
    # GitHub Packages. It is not a default worth relying on: an org that sets restricted default
    # permissions would otherwise fail the sync with a 403 that reads like a missing grant.
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ci-jobs.yml
    with:
      artifact-source: private

  fork:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: read
    uses: ./.github/workflows/ci-jobs.yml
    with:
      artifact-source: npm

  # Passes only when exactly one caller ran and succeeded and the other was skipped. `if: always()`
  # so a failed or cancelled caller makes THIS fail, rather than leaving it skipped, which a
  # required check or a `needs` consumer can read as passing.
  ci:
    name: Build & Test
    if: always()
    needs: [internal, fork]
    runs-on: ubuntu-latest
    steps:
      - name: One caller ran, and every job of it passed
        env:
          INTERNAL: ${{ needs.internal.result }}
          FORK: ${{ needs.fork.result }}
        run: |
          echo "internal: $INTERNAL, fork: $FORK"
          case "$INTERNAL/$FORK" in
            success/skipped | skipped/success) ;;
            *) echo "::error::CI did not pass (internal: $INTERNAL, fork: $FORK)"; exit 1 ;;
          esac
