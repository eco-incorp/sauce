name: CI

on:
  pull_request:
  push:
    # Tags too: a tag is what publishes, and `branches` does NOT match a tag push, so before this
    # the released commit was the one commit nothing ever checked.
    branches: [main]
    tags: ["v*"]
  # Callable, so publish.yml can gate on these exact steps instead of copying them. A copy would
  # drift, and a gate that has drifted is the thing being fixed here.
  workflow_call:

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    # `packages: read` is what lets the built-in GITHUB_TOKEN pull the v12 engine artifacts from
    # GHCR. It is not a default worth relying on: an org that sets restricted default permissions
    # would otherwise fail the sync with a 403 that reads like a missing grant.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ---- engine artifacts + the v12 releases --------------------------------
      # The EVM artifacts (sdk/{dist,src}/artifacts — Router, V12*, interfaces) ship to downstream
      # SDK consumers for their local tests/deploys, and are build output rather than committed, so
      # this both regenerates them and asserts the generation produced every one.
      #
      # Everything comes from the v12 RELEASES, each asset pinned by version AND by a digest committed
      # in sdk/src/deployments/releases.json, in the row of the installed compiler. The components
      # release independently, so there is no single shared commit to pin — the digest is the
      # guarantee. `--fetch-v12-engines` downloads them into a
      # cache, checks each against its digest, and prints `NAME=<path>` lines; the grep hands every
      # one to $GITHUB_ENV. It is deliberately a wildcard: a newly pinned artifact reaches the suites
      # that need it without a matching edit here, which is how SAUCE_KITCHEN_SO would otherwise have
      # been silently absent. The artifacts come from GHCR, where the packages are private and this
      # repository is granted read on each, so the built-in GITHUB_TOKEN is the whole credential —
      # no PAT, and nothing published publicly.
      #
      # The suites that consume these HARD-FAIL when their variable is absent, so a future edit here
      # cannot quietly return them to skipping — a skipped suite and a passing suite are the same
      # line in jest's summary, which is how they went unrun for their whole life before.
      - name: Sync engine artifacts and fetch the v12 engines
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pnpm --filter './sdk' sync-engine-artifacts --fetch-v12-engines | tee "$RUNNER_TEMP/sync.log"
          grep -E '^SAUCE_[A-Z0-9_]+=' "$RUNNER_TEMP/sync.log" >> "$GITHUB_ENV"
          # dist/artifacts is BUILD OUTPUT (git-ignored, nothing committed): five ABIs from the
          # release's abis.json, IERC20 declared in the script, IUniswapV3Pool from @uniswap/v3-core,
          # V12RuntimeBytecode from the release's creation code, V12EngineGate and V12Deployments. Assert
          # all 11 exist, so a broken generation (a missing node_modules entry, an unreachable release)
          # fails CI here instead of shipping an empty dir — the exact regression that broke 0.7.0.
          for a in IERC20 ISauceRouter IUniswapV3Pool Router V12QuoteRouter V12Kitchen V12KitchenProxy V12Pot V12RuntimeBytecode V12EngineGate V12Deployments; do
            test -s "sdk/dist/artifacts/$a.json" || { echo "::error::sync did not produce sdk/dist/artifacts/$a.json"; exit 1; }
          done

      # No runtime DERIVATION step any more, and its absence is the point.
      #
      # The EVM suites deploy creation code at its release address: the constructor binds the
      # engine identity used by the Pot EVAL relay. SAUCE_V12_RUNTIME_CREATION_HEX comes from sync.
      # -----------------------------------------------------------------------

      # ---- SVM engine binary ------------------------------------------------
      # The tests too: `typecheck` also checks sdk/tsconfig.test.json. sdk/tsconfig.json's `include`
      # is src-only and ts-jest runs with diagnostics off, which is how a test file that did not
      # parse once shipped through three green runs.
      - name: SDK — typecheck
        run: pnpm --filter './sdk' typecheck

      - name: SDK — build
        run: pnpm --filter './sdk' build

      # The build regenerates the agent skills' references and the manual's reference from the SDK's
      # registries (`gen-skills-references.mjs`: the globals index, the chains, the protocols and
      # the tokens, for each audience). They are committed, so a registry change that did not commit
      # the regenerated files leaves the tree dirty here.
      - name: Agent skills and the manual's reference — the committed generated files are current
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- skills docs/reference docs/guides/distributed-swap.md)" ]; then
            git status --porcelain -- skills docs/reference docs/guides/distributed-swap.md
            git diff -- skills docs/reference docs/guides/distributed-swap.md
            echo "::error::the SDK build changed skills/ or the manual's generated pages: rebuild the SDK and commit the regenerated files"
            exit 1
          fi

      # SAUCE_RUST_ENGINE_SO / SAUCE_V12_RUNTIME_CREATION_HEX come from $GITHUB_ENV, exported by the
      # engine steps above. Both @sauce/token e2e suites hard-fail in CI when either is unset, so a
      # broken export is loud rather than a silent skip.
      #
      # TWO invocations, engine suites first — see the next step for why. Together they cover every
      # suite: the patterns are exact complements, and a file matching neither would fail the count
      # asserted below.
      - name: SDK — test (engine e2e)
        # Set here because these steps invoke jest directly rather than through the package's
        # `test` script, which is where NODE_OPTIONS normally comes from.
        env:
          NODE_OPTIONS: --experimental-vm-modules
          # Names each test on unbuffered stderr as it starts. A native abort kills the process
          # before jest flushes, so without this a crashing suite reports no test at all.
          SAUCE_TRACE_TESTS: "1"
        run: |
          set -euo pipefail
          cd sdk
          # ONE PROCESS PER SUITE, and the engine suites separated from the rest.
          #
          # Running all ~181 suites in one jest process aborts with a native std::bad_alloc after
          # every test has PASSED — at the end, during teardown, with GBs free and no ulimit, so it
          # is not exhaustion. It was measured: the engine suites peak between 495 and 785 MB, and
          # the one that aborted was the LOWEST of them. Reverting this split reproduced the abort
          # immediately, which is why it is here rather than a tidier single command.
          #
          # Each suite in its own short-lived process avoids it, and makes a crash name the suite.
          # (Distinct from the aborts fixed in the suites themselves — calling litesvm accessors on
          # a failed transaction or a closed account; see `kitchen-bench.ts`.)
          node_modules/.bin/jest --config jest.config.cjs --listTests \
            --testPathPattern '\.e2e\.test\.ts$' > "$RUNNER_TEMP/e2e-suites.txt"
          [ -s "$RUNNER_TEMP/e2e-suites.txt" ] || { echo "::error::no engine e2e suites matched"; exit 1; }
          failed=""
          while IFS= read -r suite; do
            name=$(basename "$suite")
            echo "::group::$name"
            log="$RUNNER_TEMP/$name.log"
            # `|| failed=...` rather than letting -e stop the loop: one run then reports EVERY suite,
            # which is what distinguishes "this suite is broken" from "the box gave out".
            set +e
            node_modules/.bin/jest --config jest.config.cjs --runInBand --forceExit --runTestsByPath "$suite" 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            # `--forceExit`: jest calls process.exit() once the run is reported, which skips the
            # native finalizers. Measured: on a retry the suite printed `Tests: 4 passed` and
            # `Ran all test suites`, and only THEN aborted — every test had passed and the abort
            # poisoned nothing but the exit status. That case this converts to a true green, and it
            # cannot hide a failure, because jest derives the code from the results before exiting.
            #
            # TODO(litesvm-abort): remove BOTH the flag above and this retry once the abort itself is
            # fixed. Not tracked in Linear yet — the condition for deleting them is that a suite can
            # run this step 20 times without a ::warning:: firing. Until then the warning below is
            # the only signal that the root cause is still there, so do not silence it.
            #
            # RETRY ONCE, and only for the litesvm native abort.
            #
            # The other case, which --forceExit cannot reach: the abort sometimes lands mid-teardown
            # BEFORE jest reports, so the suite prints no test at all. That is what this retries.
            #
            # `terminate called ... std::bad_alloc` fires in litesvm's native teardown AFTER every
            # test in the suite has passed, killing node before jest flushes — so the suite reports
            # no test at all. It is runner-only (never reproduces on darwin/arm64 or in linux
            # containers), it moves between the three kitchen suites run to run, and it survived the
            # fix that removed the VM reference-clear. Left alone it failed most runs that reached
            # this step, which is a gate that reports noise rather than signal.
            #
            # Deliberately narrow: gated on that exact string, so a real test failure, a crash with
            # any other message, or a second bad_alloc all still fail the job.
            if [ "$status" -ne 0 ] && grep -q 'std::bad_alloc' "$log"; then
              echo "::warning::$name aborted with std::bad_alloc (litesvm native teardown) — retrying once"
              set +e
              node_modules/.bin/jest --config jest.config.cjs --runInBand --forceExit --runTestsByPath "$suite" 2>&1 | tee "$log.retry"
              status=${PIPESTATUS[0]}
              set -e
            fi
            [ "$status" -eq 0 ] || failed="$failed $name"
            echo "::endgroup::"
          done < "$RUNNER_TEMP/e2e-suites.txt"
          [ -z "$failed" ] || { echo "::error::engine e2e suites failed:$failed"; exit 1; }

      - name: SDK — test (everything else)
        env:
          NODE_OPTIONS: --experimental-vm-modules
        run: pnpm --filter './sdk' exec jest --config jest.config.cjs --testPathIgnorePatterns '\.e2e\.test\.ts$'

      # The split must not silently drop a suite: assert the two halves still add up to every file
      # jest can see.
      - name: SDK — the split covers every suite
        run: |
          set -euo pipefail
          cd sdk
          all=$(node_modules/.bin/jest --config jest.config.cjs --listTests | wc -l)
          e2e=$(node_modules/.bin/jest --config jest.config.cjs --listTests --testPathPattern '\.e2e\.test\.ts$' | wc -l)
          rest=$(node_modules/.bin/jest --config jest.config.cjs --listTests --testPathIgnorePatterns '\.e2e\.test\.ts$' | wc -l)
          echo "all=$all e2e=$e2e rest=$rest"
          [ "$all" -eq "$((e2e + rest))" ] || { echo "::error::the test split covers $((e2e + rest)) of $all suites"; exit 1; }

      - name: Actions — typecheck
        run: pnpm --filter './actions' typecheck

      - name: Actions — build
        run: pnpm --filter './actions' build

      # The MCP server reads the SDK's dist/ (the sauce command's own modules), so it comes after
      # the SDK build, as actions does.
      - name: MCP — typecheck
        run: pnpm --filter './mcp' typecheck

      - name: MCP — build
        run: pnpm --filter './mcp' build

      # dev-tools reads the SDK's dist/ too, so this comes after the SDK build. Its tests run under
      # tsx, which strips types without checking them; this is where they are checked.
      - name: Dev Tools — typecheck
        run: pnpm --filter './dev-tools' typecheck

      # The testing kit (`@eco-incorp/sauce/testing`) ships from dev-tools/dist, which the packed
      # check at the end installs.
      - name: Dev Tools — build
        run: pnpm --filter './dev-tools' build

      # The SDK compiles in a browser. Every browser-facing export is bundled with esbuild for the
      # browser and must reach no Node builtin (and no Node global from the SDK's own modules); then
      # the README's route example, a raw compile, the settle recipe, two builders and an
      # actions program run in headless Chromium and must produce the bytes Node does. The packed
      # check at the end repeats both against the installed tarball.
      - name: Browser — no Node in any browser-facing export
        run: node sdk/scripts/check-browser-bundles.mjs

      - name: Browser — install headless Chromium
        run: pnpm exec playwright-core install --with-deps --only-shell chromium

      - name: Browser — compile in headless Chromium, byte-identical to Node
        run: node sdk/scripts/check-browser-compile.mjs

      - name: Documentation — links and executable examples
        run: pnpm docs:check

      # The agent skills `sauce skills install` ships: every program compiled through the `sauce`
      # bin on each chain its index names and its command line run offline, every command line's
      # flags held to the CLI, every runner executed with the network disabled, the SauceScript
      # reference held to the compiler, and the wording rules (no versions, agent names, engine
      # internals or invented addresses). It needs the SDK and actions builds above.
      - name: Agent skills — examples, commands and wording
        run: pnpm skills:check

      - name: Actions — unit tests
        run: pnpm --filter './actions' test:unit

      # `test:unit` needs no RPC: its `*.exec.test.ts` suites execute on a local anvil through the
      # released engine (Foundry and SAUCE_V12_RUNTIME_CREATION_HEX are set up above, and they throw
      # under CI rather than skip).
      #
      # The prod-like suites — every action, every quote, the split swap — run against real mainnet
      # contracts on a LOCAL anvil booted from state captured at a pinned block and checked in
      # (`actions/tests/state/*.genesis.json.gz`, see `actions/tests/mainnet.ts`). No secret and no
      # network: a replayed suite refuses to fork and fails on any non-local request. Recapturing is a
      # maintainer step (CLAUDE.md), never part of CI.
      - name: Actions — mainnet-state suites
        run: pnpm --filter './actions' test:mainnet

      - name: Dev Tools — test
        run: pnpm --filter './dev-tools' test

      # Every tool in process, the bin over stdio and Streamable HTTP, and the tools against a
      # local anvil with the released gated stack (the CLI suites' harness, which throws under CI
      # without SAUCE_V12_RUNTIME_CREATION_HEX rather than skip). No live RPC.
      - name: MCP — test
        run: pnpm --filter './mcp' test

      # A consumer install, from the packed tarball into an empty directory — which is the only way
      # to catch a workspace dependency that every in-repo test resolves for free.
      - name: Verify a clean consumer install of the packed SDK
        run: node sdk/scripts/check-packed-package.mjs
